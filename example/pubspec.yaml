name: ianvs_design_gallery
description: Interactive reference gallery for Ianvs Design.
publish_to: none
version: 0.3.0+4
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ianvs_design:
    path: ../
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-OFL.txt
    - assets/fonts/RobotoMono-OFL.txt
  fonts:
    - family: GallerySans
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: GalleryMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
